<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>LexSure CRM Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#162040; --gold:#b8924a; --gold2:#d4aa6a;
  --white:#fff; --cream:#faf8f4; --parch:#f5f0e8;
  --border:#e2ddd5; --muted:#6b7280;
  --green:#15803d; --red:#dc2626; --yellow:#d97706;
  --text:#0e1117;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}

/* NAV */
.nav{
  background:var(--navy);padding:0 5%;height:60px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(184,146,74,0.2);
  position:sticky;top:0;z-index:100;
}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-brand img{width:30px;height:30px;border-radius:50%}
.nav-brand span{color:var(--gold);font-size:16px;font-weight:600}
.nav-brand small{color:rgba(255,255,255,0.35);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;display:block}
.nav-right{display:flex;align-items:center;gap:12px}
.refresh-btn{
  background:rgba(184,146,74,0.15);border:1px solid rgba(184,146,74,0.3);
  color:var(--gold);padding:7px 16px;border-radius:5px;
  font-size:12px;font-weight:600;cursor:pointer;
  font-family:'DM Sans',sans-serif;transition:all 0.2s;
}
.refresh-btn:hover{background:rgba(184,146,74,0.25)}
.last-updated{color:rgba(255,255,255,0.3);font-size:11px;font-family:'DM Mono',monospace}

/* MAIN */
.main{padding:28px 5%;max-width:1200px;margin:0 auto}

/* STATUS BAR */
.status-bar{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;border-radius:6px;
  margin-bottom:24px;font-size:13px;
}
.status-bar.loading{background:#e0e7ff;color:#3730a3}
.status-bar.ok{background:#dcfce7;color:#166534}
.status-bar.error{background:#fee2e2;color:#991b1b}
.spinner{
  width:14px;height:14px;border:2px solid currentColor;
  border-top-color:transparent;border-radius:50%;
  animation:spin 0.7s linear infinite;display:inline-block;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* STAT CARDS */
.stats-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;margin-bottom:28px;
}
.stat-card{
  background:var(--white);border:1px solid var(--border);
  border-radius:10px;padding:20px 18px;
  border-left:3px solid var(--gold);
}
.stat-label{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.stat-value{font-size:30px;font-weight:700;color:var(--navy);line-height:1}
.stat-sub{font-size:11px;color:var(--muted);margin-top:5px}
.stat-card.red{border-left-color:#dc2626}
.stat-card.green{border-left-color:#15803d}
.stat-card.yellow{border-left-color:#d97706}

/* SECTIONS */
.section-title{
  font-size:13px;font-weight:600;color:var(--navy);
  letter-spacing:1px;text-transform:uppercase;
  margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.section-title::before{
  content:'';display:block;width:3px;height:14px;
  background:var(--gold);border-radius:2px;
}

/* PIPELINE TABLE */
.table-wrap{
  background:var(--white);border:1px solid var(--border);
  border-radius:10px;overflow:hidden;margin-bottom:24px;
}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:var(--navy)}
thead th{
  color:rgba(255,255,255,0.7);font-weight:500;
  padding:11px 14px;text-align:left;font-size:11px;
  letter-spacing:0.5px;text-transform:uppercase;white-space:nowrap;
}
tbody tr{border-bottom:1px solid var(--border);transition:background 0.15s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--parch)}
td{padding:11px 14px;vertical-align:middle}
td.name{font-weight:600;color:var(--navy)}
td.ref{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}
td.amount{font-weight:600}

/* STAGE BADGES */
.stage{
  display:inline-block;padding:3px 10px;border-radius:12px;
  font-size:11px;font-weight:500;white-space:nowrap;
}
.stage.new       {background:#e0e7ff;color:#3730a3}
.stage.pending   {background:#fef9c3;color:#854d0e}
.stage.paid      {background:#dcfce7;color:#166534}
.stage.generated {background:#dbeafe;color:#1e40af}
.stage.delivered {background:#f0fdf4;color:#14532d;border:1px solid #86efac}
.stage.followup  {background:#fff7ed;color:#c2410c}
.stage.cold      {background:#fee2e2;color:#991b1b}

/* ALERT CARDS */
.alerts-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:12px;margin-bottom:24px;
}
.alert-card{
  border-radius:8px;padding:14px 16px;
  display:flex;align-items:flex-start;gap:12px;
  border:1px solid;
}
.alert-card.urgent{background:#fff1f2;border-color:#fca5a5}
.alert-card.warn  {background:#fffbeb;border-color:#fcd34d}
.alert-card.info  {background:#eff6ff;border-color:#93c5fd}
.alert-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.alert-title{font-weight:600;font-size:13px;margin-bottom:2px}
.alert-desc{font-size:12px;color:var(--muted);line-height:1.5}
.alert-card.urgent .alert-title{color:#991b1b}
.alert-card.warn   .alert-title{color:#92400e}
.alert-card.info   .alert-title{color:#1e40af}

/* EMPTY STATE */
.empty{
  text-align:center;padding:40px 20px;
  color:var(--muted);font-size:13px;
}
.empty-icon{font-size:32px;margin-bottom:10px}

/* TWO COL */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}

/* REVENUE BAR */
.rev-item{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.rev-label{display:flex;justify-content:space-between;font-size:12px}
.rev-label span{color:var(--muted)}
.rev-label strong{color:var(--navy)}
.rev-bar-bg{background:var(--parch);border-radius:3px;height:6px;overflow:hidden}
.rev-bar{height:100%;background:var(--gold);border-radius:3px;transition:width 1s ease}

@media(max-width:700px){
  .two-col{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .main{padding:16px 4%}
  thead th:nth-child(n+5){display:none}
  td:nth-child(n+5){display:none}
}
</style>
</head>

      <span>LexSure</span>
      <small>CRM Dashboard</small>
    </div>
  </div>
  <div class="nav-right">
    <div class="last-updated" id="lastUpdated">—</div>
    <button class="refresh-btn" onclick="loadDashboard()">↻ Refresh</button>
  </div>
</nav>

<div class="main">

  <div class="status-bar loading" id="statusBar">
    <span class="spinner"></span>&nbsp; Loading dashboard data…
  </div>

  <!-- STAT CARDS -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="stat-label">Total Leads</div><div class="stat-value" id="s-total">—</div><div class="stat-sub">All time</div></div>
    <div class="stat-card green"><div class="stat-label">Total Revenue</div><div class="stat-value" id="s-revenue">—</div><div class="stat-sub">Amount paid</div></div>
    <div class="stat-card"><div class="stat-label">This Month</div><div class="stat-value" id="s-month">—</div><div class="stat-sub">New leads</div></div>
    <div class="stat-card red"><div class="stat-label">Pending Approval</div><div class="stat-value" id="s-pending">—</div><div class="stat-sub">Awaiting YES</div></div>
    <div class="stat-card yellow"><div class="stat-label">Reports Sent</div><div class="stat-value" id="s-sent">—</div><div class="stat-sub">All time</div></div>
    <div class="stat-card"><div class="stat-label">NRI Clients</div><div class="stat-value" id="s-nri">—</div><div class="stat-sub">All time</div></div>
  </div>

  <!-- ALERTS -->
  <div class="section-title">🚨 Attention Needed</div>
  <div id="alertsContainer" class="alerts-grid"></div>

  <!-- PIPELINE -->
  <div class="section-title">📋 Client Pipeline</div>
  <div class="table-wrap">
    <table id="pipelineTable">
      <thead>
        <tr>
          <th>Ref</th>
          <th>Client</th>
          <th>Property</th>
          <th>Stage</th>
          <th>Amount</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="pipelineBody">
        <tr><td colspan="7" class="empty"><div class="empty-icon">⏳</div>Loading…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
const ENGINE = 'https://script.google.com/macros/s/AKfycbzliAjfP7AWr-JIvGuUTnNrvTO--bLWv6_zwK9FAcMByjifQnOF1ZzGmTwUSL25m7yY/exec';

async function loadDashboard() {
  const bar = document.getElementById('statusBar');
  bar.className = 'status-bar loading';
  bar.innerHTML = '<span class="spinner"></span>&nbsp; Refreshing…';

  try {
    const res = await fetch(ENGINE + '?action=getDashboard', {cache:'no-store'});
    const data = await res.json();

    if (data.error) throw new Error(data.error);

    renderStats(data);
    renderAlerts(data.alerts || []);
    renderPipeline(data.pipeline || []);

    document.getElementById('lastUpdated').textContent =
      'Updated: ' + new Date().toLocaleTimeString('en-IN');

    bar.className = 'status-bar ok';
    bar.innerHTML = '✅ Dashboard loaded successfully';
    setTimeout(() => bar.style.display='none', 3000);

  } catch(err) {
    bar.className = 'status-bar error';
    bar.innerHTML = '❌ Could not load data. Make sure Apps Script is deployed with getDashboard function. <button onclick="loadDashboard()" style="margin-left:10px;padding:3px 10px;cursor:pointer">Retry</button>';
    console.error(err);
  }
}

function renderStats(data) {
  const s = data.stats || {};
  document.getElementById('s-total').textContent = s.total || 0;
  document.getElementById('s-revenue').textContent = s.revenue ? '₹' + Number(s.revenue).toLocaleString('en-IN') : '₹0';
  document.getElementById('s-month').textContent = s.thisMonth || 0;
  document.getElementById('s-pending').textContent = s.pending || 0;
  document.getElementById('s-sent').textContent = s.sent || 0;
  document.getElementById('s-nri').textContent = s.nri || 0;

  // Highlight if attention needed
  if ((s.pending || 0) > 0) document.getElementById('s-pending').style.color = '#dc2626';
}

function renderAlerts(alerts) {
  const container = document.getElementById('alertsContainer');
  if (!alerts.length) {
    container.innerHTML = '<div class="alert-card info"><div class="alert-icon">✅</div><div><div class="alert-title">All Clear</div><div class="alert-desc">No pending actions or follow-ups needed.</div></div></div>';
    return;
  }
  container.innerHTML = alerts.map(a => `
    <div class="alert-card ${a.type || 'warn'}">
      <div class="alert-icon">${a.icon || '⚠️'}</div>
      <div>
        <div class="alert-title">${esc(a.title)}</div>
        <div class="alert-desc">${esc(a.desc)}</div>
      </div>
    </div>
  `).join('');
}

function stageClass(stage) {
  if (!stage) return 'new';
  const s = stage.toLowerCase();
  if (s.includes('new') || s.includes('inquiry')) return 'new';
  if (s.includes('pending')) return 'pending';
  if (s.includes('paid')) return 'paid';
  if (s.includes('generated')) return 'generated';
  if (s.includes('delivered')) return 'delivered';
  if (s.includes('follow')) return 'followup';
  if (s.includes('cold') || s.includes('lost')) return 'cold';
  return 'new';
}

function renderPipeline(rows) {
  const body = document.getElementById('pipelineBody');
  if (!rows.length) {
    body.innerHTML = '<tr><td colspan="7" class="empty"><div class="empty-icon">📭</div>No submissions yet</td></tr>';
    return;
  }
  body.innerHTML = rows.map(r => `
    <tr>
      <td class="ref">${esc(r.ref || '')}</td>
      <td class="name">${esc(r.name || '')}<br/><span style="font-size:11px;color:var(--muted);font-weight:400">${esc(r.phone || '')}</span></td>
      <td style="font-size:12px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.property || '')}</td>
      <td><span class="stage ${stageClass(r.stage)}">${esc(r.stage || 'New')}</span></td>
      <td class="amount" style="color:${r.amount>0?'var(--green)':'var(--muted)'}">${r.amount>0 ? '₹'+Number(r.amount).toLocaleString('en-IN') : 'Free'}</td>
      <td style="font-size:12px;color:var(--muted);white-space:nowrap">${esc(r.date || '')}</td>
      <td>
        ${r.reportUrl ? `<a href="${r.reportUrl}" target="_blank" style="font-size:11px;color:var(--gold);text-decoration:none;font-weight:600">📄 Report</a>` : ''}
        ${r.folderUrl ? `<a href="${r.folderUrl}" target="_blank" style="font-size:11px;color:var(--muted);text-decoration:none;margin-left:8px">📁 Drive</a>` : ''}
      </td>
    </tr>
  `).join('');
}

function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Auto-refresh every 5 minutes
setInterval(loadDashboard, 5 * 60 * 1000);
loadDashboard();
</script>
</body>
</html>
